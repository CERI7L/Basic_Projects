<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email Header Checker</title>

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #eef2f6;
            color: #203047;
            font-family: Arial, sans-serif;
        }

        .checker-box {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border: 1px solid #d5dce5;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 26px;
        }

        label {
            display: block;
            margin: 24px 0 10px;
            font-weight: bold;
        }

        input[type="file"] {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            border: 2px dashed #aab8cb;
            border-radius: 8px;
            background: #f8fafc;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2457a7;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #194381;
        }

        button:focus-visible {
            outline: 3px solid #91baff;
            outline-offset: 3px;
        }

        .output-box {
            min-height: 100px;
            padding: 16px;
            border: 1px solid #d5dce5;
            border-radius: 8px;
            background: #f8fafc;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main class="checker-box">
        <h1>Email Header Checker</h1>
        <p>Select an email file to review its headers and recorded authentication results.</p>

        <form id="email-form">
            <label for="email-file">Choose an .eml file</label>

            <input
                type="file"
                id="email-file"
                name="email_file"
                accept=".eml"
                required
            >

            <button type="submit">Check email</button>
        </form>

        <h2>Results</h2>
        <pre id="results" class="output-box" role="status">Choose an .eml file, then click Check email. Python loads on the first check; internet access is required.</pre>
    </main>

<!-- Python runtime: runs on this computer, inside the browser. -->
<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>

<!-- Original VerifyEmail.py, embedded so double-clicking this HTML works. -->
<script id="python-code" type="text/plain">
import re

from pathlib import Path
from email import policy
from email.parser import BytesParser
from email.utils import parseaddr


def read_email(file_path: str) -> dict:
    path = Path(file_path)

    if not path.is_file():
        raise FileNotFoundError(f"Could not find file: {path}")

    if path.suffix.lower() != ".eml":
        raise ValueError("Please select an .eml file.")

    with path.open("rb") as file:
        message = BytesParser(policy=policy.default).parse(file)

    return {
        "subject": str(message.get("Subject", "")),
        "sender": str(message.get("From", "")),
        "reply_to": str(message.get("Reply-To", "")),
        "return_path": str(message.get("Return-Path", "")),
    }


def get_domain(address: str) -> str:
    return address.rsplit("@", 1)[1].lower() if "@" in address else ""


def screen_record(record: dict) -> str:
    findings = []

    sender_name, sender_address = parseaddr(record["sender"])
    _, reply_address = parseaddr(record["reply_to"])
    _, return_address = parseaddr(record["return_path"])

    sender_domain = get_domain(sender_address)
    reply_domain = get_domain(reply_address)
    return_domain = get_domain(return_address)

    if not sender_domain:
        findings.append("Missing or unrecognized sender email address.")

    if (
        sender_domain
        and reply_domain
        and sender_domain != reply_domain
    ):
        findings.append(
            f"Reply-To domain differs from sender domain: "
            f"{reply_domain} versus {sender_domain}."
        )

    if (
        sender_domain
        and return_domain
        and sender_domain != return_domain
    ):
        findings.append(
            f"Return-Path domain differs from sender domain: "
            f"{return_domain} versus {sender_domain}. "
            "Mailing services commonly cause this."
        )

    # Detect a display name that looks like a different email address.
    if "@" in sender_name:
        _, displayed_address = parseaddr(sender_name)

        if (
            get_domain(displayed_address)
            and sender_address
            and displayed_address.casefold() != sender_address.casefold()
        ):
            findings.append(
                f"Display name presents a different email address: "
                f"{displayed_address} versus {sender_address}."
            )

    if findings:
        return (
            "Assessment: Review needed\n\n"
            + "\n".join(f"- {finding}" for finding in findings)
            + "\n\nThese differences do not prove phishing."
        )

    return (
        "Assessment: No obvious header mismatches detected.\n"
        "This does not verify the sender or establish that the email is safe."
    )

def show_authentication_results(file_path: str) -> None:
    with Path(file_path).open("rb") as file:
        message = BytesParser(policy=policy.default).parse(file)

    headers = message.get_all("Authentication-Results", [])

    print("\n--- Recorded email authentication ---")

    if not headers:
        print("No Authentication-Results headers found.")
        return

    for number, header in enumerate(headers, start=1):
        # Put folded header lines onto one line for easier reading.
        header = " ".join(str(header).split())
        server = header.split(";", 1)[0].strip()

        print(f"\nHeader {number} — reporting server: {server}")

        for method in ("spf", "dkim", "dmarc"):
            # Capture each result and its accompanying recorded details.
            matches = re.findall(
                rf"(?:^|;)\s*{method}\s*=\s*"
                rf"([a-zA-Z0-9_-]+)([^;]*)",
                header,
                flags=re.IGNORECASE,
            )

            if not matches:
                print(f"\n{method.upper()}: not recorded")
                continue

            for result, details in matches:
                print(f"\n{method.upper()}: {result.lower()}")
                print(f"  Recorded details: {details.strip() or '(none)'}")

        print(f"\nFull authentication header:\n{header}")

    print("\nRecorded claims only; reporting-server trust is not checked.")

if __name__ == "__main__":
    file_path = input(
        "Enter the path to your .eml file: "
    ).strip().strip('"')

    try:
        email_record = read_email(file_path)

        print(f"\nSubject: {email_record['subject']}")
        print(f"From: {email_record['sender']}")
        print(f"Reply-To: {email_record['reply_to'] or '(not provided)'}")
        print(f"Return-Path: {email_record['return_path'] or '(not provided)'}")
        print()
        print(screen_record(email_record))
        show_authentication_results(file_path)

    except (OSError, ValueError) as error:
        print(f"Could not check email: {error}")
</script>

<script>
const form = document.getElementById("email-form");
const results = document.getElementById("results");
const button = form.querySelector("button");
let pythonReady;

async function startPython() {
    const python = await loadPyodide();
    python.globals.set("python_source",
        document.getElementById("python-code").textContent);
    python.runPython(`
checker = {"__name__": "VerifyEmail_browser"}
exec(python_source, checker)
`);
    return python;
}

form.addEventListener("submit", async (event) => {
    event.preventDefault(); // Keep the report on this page.
    const file = document.getElementById("email-file").files[0];
    if (!file || !file.name.toLowerCase().endsWith(".eml")) {
        results.textContent = "Please select an .eml file.";
        return;
    }
    button.disabled = true;
    results.textContent = "Loading Python and checking email...";
    try {
        pythonReady ??= startPython().catch((error) => {
            pythonReady = null;
            throw error;
        });
        const python = await pythonReady;
        // Preserve the original email bytes in Python's in-memory filesystem.
        python.FS.writeFile("/selected.eml",
            new Uint8Array(await file.arrayBuffer()));
        try {
            results.textContent = python.runPython(`
from contextlib import redirect_stdout
from io import StringIO

output = StringIO()
with redirect_stdout(output):
    record = checker["read_email"]("/selected.eml")
    print("Subject:", record["subject"])
    print("From:", record["sender"])
    print("Reply-To:", record["reply_to"] or "(not provided)")
    print("Return-Path:", record["return_path"] or "(not provided)")
    print()
    print(checker["screen_record"](record))
    checker["show_authentication_results"]("/selected.eml")
output.getvalue()
`);
        } finally {
            python.FS.unlink("/selected.eml");
        }
    } catch (error) {
        results.textContent = "Could not run the checker: " + error.message;
    } finally {
        button.disabled = false;
    }
});
</script>

</body>
</html>
