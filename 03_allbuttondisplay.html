<!DOCTYPE html>
<html>
    <head>
        <style>
            .buy-this {
                color: aliceblue;
                font-weight: lighter;
                font-size: large;
                background-color: rgb(29, 173, 29);
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 10px;
                padding-right: 10px;
                border-radius: 8px;
                border-radius: 18px;
            }

            .buy-this:hover {
                background-color: rgb(23, 138, 23);
                text-shadow: none;
                cursor: pointer;
               
            }

            .next {
                color: aliceblue;
                font-weight: lighter;
                font-size: x-small;
                background-color: rgb(29, 68, 75);
                padding-top: 3px;
                padding-bottom: 2px;
                padding-left: 9px;
                padding-right: 30px;
                border-radius: 8px;
                border-radius: 18px;
                border-top-right-radius: 5px;
                border-bottom-left-radius: 5px;                

                
            }

            .next:hover {
                background-color:  rgb(13, 68, 100);
                text-shadow: none;
                cursor: pointer;
                box-shadow: 5px 3px 5px rgb(82, 83, 83);
                transition: .1s;
            }

            .back {
                color: aliceblue;
                font-weight: lighter;
                font-size: x-small;
                background-color: rgb(29, 68, 75);
                padding-top: 3px;
                padding-bottom: 2px;
                padding-left: 30px;
                padding-right: 9px;
                border-radius: 8px;
                border-radius: 18px;
                border-top-left-radius: 5px;
                border-bottom-right-radius: 5px;
                margin-left: 20px;
                

                
            }

            .back:hover {
                background-color:  rgb(13, 68, 100);
                text-shadow: none;
                cursor: pointer;
                box-shadow: -5px 3px 5px rgb(82, 83, 83);
                transition: .1s;
            }

            .update {
                font-weight: thin;
                font-size: large;
                font-style: normal;
                background-color: rgb(184, 247, 214);
                color: rgb(15, 175, 122);
                border-color: rgb(15, 175, 122);
                border-style: none;
                border-radius: 3px;
                height: 60px;
                width: 100px;
                margin-left: 30px;
            }
            .update:hover {
                background-color: rgb(15, 175, 122);
                color: aliceblue;
                cursor: pointer;
                transition: .2s;
            }
            
            .back1 {
                color: rgb(14, 158, 184);
                font-weight: lighter;
                font-size: x-small;
                border-style:none;
                background-color: rgb(199, 235, 241);
                padding-top: 7px;
                padding-bottom: 5px;
                padding-left: 10px;
                padding-right: 10px;
                border-radius: 8px;
                border-radius: 18px;
                border-bottom-left-radius: 5px;
                border-bottom-right-radius: 5px;
                margin-left: 20px;
                display:inline-block
                }

            .back1:hover {
                background-color: rgb(14, 158, 184);
                color: aliceblue;
                cursor: pointer;
                transition: .2s;
            }
            .next1 {
                color: rgb(14, 158, 184);
                font-weight: lighter;
                font-size: x-small;
                border-style:none;
                background-color: rgb(199, 235, 241);
                padding-top: 7px;
                padding-bottom: 5px;
                padding-left: 10px;
                padding-right: 10px;
                border-radius: 8px;
                border-radius: 18px;
                border-bottom-left-radius: 5px;
                border-bottom-right-radius: 5px;
                margin-left: 0px;
                display: inline-block;
             }
            .next1:hover {
                background-color: rgb(14, 158, 184);
                color: aliceblue;
                cursor: pointer;
                transition: .2s;
            }
            .page1 {
                 background-color: rgb(251, 252, 252);
                color: rgb(11, 70, 160);
                border-color: white;
                border-width: 0px;
                border-radius: 10px;
                text-decoration: underline;
                cursor: pointer;
                margin-left: 0;
                
             }

             .page1:hover {
                opacity: .8;
            }
            .page2 {
                 background-color:white;
                color: rgb(11, 70, 160);
                border-color: white;
                border-width: 0px;
                border-radius: 5px;
                text-decoration: underline;
                cursor: pointer;
             }

            .page2:hover {
                opacity: .8;
            }
            .page3 {
                 background-color:white;
                color: rgb(11, 70, 160);
                border-color: white;
                border-width: 0px;
                border-radius: 5px;
                text-decoration: underline;
                cursor: pointer;
             }

            .page3:hover {
                opacity: .8;
            }

            .page4 {
                 background-color:white;
                color: rgb(11, 70, 160);
                border-color: white;
                border-width: 0px;
                border-radius: 5px;
                text-decoration: underline;
                cursor: pointer;
             }

            .page4:hover {
                opacity: .8;
            }

            .page5 {
                 background-color:white;
                color: rgb(11, 70, 160);
                border-color: white;
                border-width: 0px;
                border-radius: 5px;
                text-decoration: underline;
                cursor: pointer;
             }

            .page5:hover {
                opacity: .8;
            }
            
            .button-container {
                font-size: 0;
            }
            
            .button-container button {
                font-size: x-small;
            }

            .start {
                background-color: rgb(170, 204, 241);
                color: rgb(58, 58, 247);
                margin-top: 70px;
                margin-left: 70px;
                font-weight: 600;
                font-size: medium;
                font-style: normal;                
                border-style: none;
                border-radius: 7px;
                height: 40px;
                width: 66px;
                
            }
            .start:hover {
                background-color: RGB(58, 58, 247);
                color: white;
                height: 80px;
                width: 132px;
                transition: .5s;
                cursor: pointer;
                
            }

            .searchbar {
                width: 150px;
            }

                /* the below does not have body existance,
                and is used to show nesting classes within 
                a specific function. The comma is used to nest
                classes which are defined by the same functions */

            .videoauthor,
            .videostates {
                display: inline-block;
            }
         
            .subscribe-button {
                background-color: rgb(200, 0, 0);
                color: white;
                border: none;
                 height: 36px;
                 width: 105px;
                 border-radius: 2px;
                 cursor: pointer;
                 margin-right: 8px;
                 transition: opacity 0.15s;
                }

            .subscribe-button:hover {
                opacity: 0.8;
            }

            .subscribe-button:active {
                opacity: 0.5;
            }

            .join-button {
                background-color: white;
                border-color: rgb(41, 118, 211);
                border-style: solid;
                border-width: 1px;
                color: rgb(41, 118, 211);
                height: 36px;
                width: 62px;
                border-radius: 2px;
                cursor: pointer;

                transition: background-color 0.15s,
                color 0.15s;
            }

            .join-button:hover {
                background-color: rgb(41, 118, 211);
                color: white;
            }

            .join-button:active {
                opacity: 0.7;
            }

            .tweet-button {
                background-color: rgb(2, 158, 255);
                color: white;
                border: none;
                height: 36px;
                width: 74px;
                border-radius: 8px;
                border-radius: 18px;
                font-weight: bold;
                font-size: 15px;
                cursor: pointer;
                margin-left: 8px;
                transition: box-shadow 0.15s;
            }

            .tweet-button:hover {
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
            }
        </style>


        </style>
    </head>

    <body>
            <button class="subscribe-button">SUBSCRIBE</button>
            <button class="join-button">JOIN</button>
            <button class="tweet-button">Tweet</button>
            
            <button class="buy-this">Buy Now</button>
            <button class="back">Back</button>
            <button class="next">Next</button>
            <button class="update">Update</button>

        <div class="button-container">
            <button class="back1">Back</button>
            <button class="page1">1</button>
            <button class="page2">2</button>
            <button class="page3">3</button>
            <button class="page4">4</button>
            <button class="page5">5</button>
            <button class="next1">Next</button>
        </div>
        
            <button class="start">Start</button>

            <input class="searchbar" type="text" placeholder="search">
    </body>

</html>
